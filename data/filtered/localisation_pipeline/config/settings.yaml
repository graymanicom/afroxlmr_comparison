# Copy this file to config/settings.yaml and edit the paths for your machine.
# Preconfigured for the nine non-English Autshumato languages you said you want to start with:
# Afrikaans, isiXhosa, isiZulu, Sepedi, Sesotho, Setswana, Siswati, Tshivenda, Xitsonga.
# Codes used here: afr, xho, zul, nso, sot, tsn, ssw, ven, tso.

project_name: localisation-pipeline
output_dir: outputs
english_column: english
other_column: other_sentence
language_column: language
source_column: source

# Local Autshumato aligned files. Each entry points to a pair of sentence-aligned files.
autshumato:
  enabled: true
  pairs:
    - language: afr
      english_path: raw_data/Autshumato/Afrikaans/Autshumato.BilingualCorpus(English-Afrikaans).v2.0.en.txt
      other_path: raw_data/Autshumato/Afrikaans/Autshumato.BilingualCorpus(English-Afrikaans).v2.0.af.txt
    - language: xho
      english_path: raw_data/Autshumato/isiXhosa/BilingualCorpus.SADiLaR.English-isiXhosa.2.0.0.CAM.2025-06-10.en.txt
      other_path: raw_data/Autshumato/isiXhosa/BilingualCorpus.SADiLaR.English-isiXhosa.2.0.0.CAM.2025-06-10.xh.txt
    - language: zul
      english_path: raw_data/Autshumato/isiZulu/Autshumato.BilingualCorpus(English-Xitsonga).v2.0.en.txt
      other_path: raw_data/Autshumato/isiZulu/Autshumato.BilingualCorpus(English-isiZulu).v2.0.zu.txt
    - language: nso
      english_path: raw_data/Autshumato/Sepedi/Autshumato.BilingualCorpus(English-Sepedi).v2.0.en.txt
      other_path: raw_data/Autshumato/Sepedi/Autshumato.BilingualCorpus(English-Sepedi).v2.0.nso.txt
    - language: sot
      english_path: raw_data/Autshumato/Sesotho/Autshumato.BilingualCorpus(English-Sesotho).v2.0.en.txt
      other_path: raw_data/Autshumato/Sesotho/Autshumato.BilingualCorpus(English-Sesotho).v2.0.st.txt
    - language: tsn
      english_path: raw_data/Autshumato/Setswana/Autshumato.BilingualCorpus(English-Setswana).v2.0.en.txt
      other_path: raw_data/Autshumato/Setswana/Autshumato.BilingualCorpus(English-Setswana).v2.0.tn.txt
    - language: ssw
      english_path: raw_data/Autshumato/Siswati/lcontent.SADILAR.BilingualCorpus(EN-SS).1.0.3.CAM.2022-03-08.en.txt
      other_path: raw_data/Autshumato/Siswati/lcontent.SADILAR.BilingualCorpus(EN-SS).1.0.3.CAM.2022-03-08.ss.txt
    - language: ven
      english_path: raw_data/Autshumato/Tshivenda/lcontent.SADILAR.BilingualCorpus(EN-VE).3.0.0.CAM.2023-12-12.en.txt
      other_path: raw_data/Autshumato/Tshivenda/lcontent.SADILAR.BilingualCorpus(EN-VE).3.0.0.CAM.2023-12-12.ve.txt
    - language: tso
      english_path: raw_data/Autshumato/Xitsonga/Autshumato.BilingualCorpus(English-Xitsonga).v2.0.en.txt
      other_path: raw_data/Autshumato/Xitsonga/Autshumato.BilingualCorpus(English-Xitsonga).v2.0.ts.txt

# Sentence-aligned Vuk'uzenzele pairs hosted on Hugging Face. Choose from Available: 
#['afr-eng', 'default', 'eng-nbl', 'eng-nso', 'eng-sot', 'eng-ssw', 'eng-tsn', 'eng-tso', 'eng-ven', 'eng-xho', 'eng-zul']
vukuzenzele:
  enabled: true
  repo_id: dsfsi/vukuzenzele-sentence-aligned
  subsets:
    - afr-eng
    - eng-nbl
    - eng-zul
    - eng-nso
    - eng-sot
    - eng-tsn
    - eng-ssw
    - eng-ven
    - eng-tso
    - eng-xho
  splits:
    - train
    - eval
    - test
  min_alignment_score: 0.75

# Shared filtering settings.
filtering:
  english:
    min_words: 8
    max_words: 32
    min_chars: 25
    max_chars: 320
    max_digit_ratio: 0.25
    max_upper_ratio_short: 0.85
    short_text_upper_ratio_len: 12
    allow_sources:
      - autshumato
      - vukuzenzele_hf
    require_institution_hit: true
    require_action_hit: true
    llm:
      enabled: false
      model: gpt-5.4
      batch_size: 20
      reasoning_effort: low
      temperature: 0.0
      max_output_tokens: 300
      # Only call the LLM if the heuristic score is in this band.
      low_confidence_rule_band: [2, 4]
  paired_language:
    min_words: 4
    max_words: 40
    require_nonempty: true
    relation_window: 8
    min_validation_score: 1
    # Optional fastText language-id gate. Leave null to disable.
    fasttext_model_path: null

lexicon:
  max_ngram: 4
  min_target_token_chars: 2

  source_thresholds:
    autshumato:
      min_candidate_count: 3 # how many times word appears in Autshumato dataset
      min_candidate_score: 0.12 # how similar words are in structure to English variant
      top_k_per_seed_lang: 50
    vukuzenzele_hf:
      min_candidate_count: 1
      min_candidate_score: 0.05
      top_k_per_seed_lang: 80

  prune:
    enabled: true
    min_tokens_by_kind:
      institution: 2
      action: 1
      document: 1
      locality: 1
      argument: 1
      access_frame: 1
    max_tokens_by_kind:
      institution: 5
      action: 4
      document: 4
      locality: 4
      argument: 4
      access_frame: 4
    drop_leading_stopword: true
    drop_trailing_stopword: true
    suppress_subphrases: true
    subphrase_score_ratio: 0.9
