[project]
name = "localisation-pipeline"
version = "0.1.0"
description = "Ingestion, lexicon induction, and filtering pipeline for multilingual South African institutional localisation pairs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "openai>=1.99.0",
  "pandas>=2.2.2",
  "pyarrow>=17.0.0",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.9.6",
  "regex>=2024.7.24",
  "scikit-learn>=1.5.1",
  "tqdm>=4.66.5",
  "typer>=0.12.5",
  "unidecode>=1.3.8"
]

[project.optional-dependencies]
langid = [
  "fasttext-wheel>=0.9.2"
]
dev = [
  "ruff>=0.6.3"
]

[project.scripts]
localisation-pipeline = "main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
